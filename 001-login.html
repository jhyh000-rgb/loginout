<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>로그인 · NSTUDY ACADEMY</title>
<style>
:root{--blue:#1457b8;--navy:#102544;--line:#dce4ef;--muted:#63738a}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,"Malgun Gothic",sans-serif;color:#18283f;background:linear-gradient(135deg,#f3f7ff,#fff 55%,#edf5ff);display:flex;flex-direction:column}header{height:76px;background:#fff;border-bottom:1px solid #e5ebf3;display:flex;align-items:center}header .inner{width:min(1080px,92%);margin:auto;display:flex;justify-content:space-between;align-items:center;gap:12px}.logo img{display:block;width:190px;max-width:48vw;height:auto;object-fit:contain}.back{color:var(--blue);font-weight:700;text-decoration:none;font-size:14px}.wrap{flex:1;display:grid;place-items:center;padding:34px 16px}.card{width:min(460px,100%);background:white;border:1px solid #e1e8f2;border-radius:22px;padding:30px;box-shadow:0 18px 55px #15335c12}.eyebrow{color:var(--blue);font-size:12px;letter-spacing:2px;font-weight:800}.card h1{font-size:28px;margin:9px 0 8px;color:var(--navy)}.desc{margin:0 0 22px;color:var(--muted);font-size:14px;line-height:1.65}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#f0f4fa;border-radius:12px;padding:5px;margin-bottom:22px}.tabs button{border:0;border-radius:9px;padding:11px;background:transparent;font-size:15px;font-weight:700;color:#63738a;cursor:pointer}.tabs button.active{background:white;color:var(--blue);box-shadow:0 2px 8px #1b376012}.field{margin:0 0 14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:7px}.field input,.field select{width:100%;border:1px solid #ccd7e5;border-radius:10px;padding:13px 12px;font-size:15px;background:#fff;min-height:46px}.field input:focus,.field select:focus{outline:2px solid #b8d4ff;border-color:var(--blue)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.full{grid-column:1/-1}.primary{width:100%;border:0;border-radius:11px;background:var(--blue);color:white;padding:14px;font-weight:800;font-size:16px;cursor:pointer;margin-top:4px}.primary:hover{background:#0d4597}.note{font-size:12px;color:var(--muted);line-height:1.6;margin:15px 0 0}.status{display:none;border-radius:10px;padding:11px 12px;margin-bottom:15px;font-size:13px;line-height:1.5;background:#edf8f1;color:#17633b}.status.error{background:#fff0f0;color:#a12626}.hidden{display:none!important}footer{text-align:center;padding:18px;color:#7a8798;font-size:12px}@media(max-width:480px){.card{padding:23px 18px;border-radius:17px}.card h1{font-size:25px}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body>
<header><div class="inner"><a class="logo" href="./index.html"><img src="./images/logo01.png" alt="NSTUDY ACADEMY"></a><a class="back" id="backLink" href="./index.html">← 홈페이지로</a></div></header>
<main class="wrap"><section class="card"><div class="eyebrow">NSTUDY ACADEMY</div><h1 id="heading">로그인</h1><p class="desc">회원 계정으로 로그인하거나 새 계정을 등록하세요.</p>
<div class="tabs"><button type="button" class="active" id="tabLogin">로그인</button><button type="button" id="tabRegister">회원가입</button></div><div id="status" class="status" role="status"></div>

<div style="margin: 0 0 16px;">
  <a href="./nstudy-bs-web/index.html" style="display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #ccd7e5;border-radius:11px;padding:13px;font-size:15px;font-weight:700;color:#18283f;text-decoration:none;box-shadow:0 1px 4px rgba(0,0,0,0.06);transition:all 0.2s;">
    <svg style="width:18px;height:18px;" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
    Google 계정으로 로그인 (nstudy-bs)
  </a>
  <div style="display:flex;align-items:center;gap:10px;margin:16px 0;color:#94a3b8;font-size:12px;">
    <span style="flex:1;height:1px;background:#e2e8f0;"></span>
    <span>또는 일반 계정 로그인</span>
    <span style="flex:1;height:1px;background:#e2e8f0;"></span>
  </div>
</div>
<form id="loginForm"><div class="field"><label for="loginId">아이디</label><input id="loginId" autocomplete="username" autocapitalize="none" required minlength="4"></div><div class="field"><label for="loginPw">비밀번호</label><input id="loginPw" type="password" autocomplete="current-password" required></div><button class="primary" type="submit">로그인</button><p class="note">기존 홈페이지의 이 브라우저에 저장된 회원 계정과 호환됩니다.</p></form>
<form id="registerForm" class="hidden"><div class="grid"><div class="field"><label for="regId">아이디 (4자 이상)</label><input id="regId" autocomplete="username" autocapitalize="none" minlength="4" required></div><div class="field"><label for="regPw">비밀번호 (6자 이상)</label><input id="regPw" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label for="regType">회원 유형</label><select id="regType"><option>학생</option><option>학부모</option><option>강사</option></select></div><div class="field"><label for="regName">성명</label><input id="regName" required></div><div class="field"><label for="regSchool">학교</label><input id="regSchool" required></div><div class="field"><label for="regGrade">학년</label><input id="regGrade" placeholder="예: 고등학교 2학년" required></div><div class="field"><label for="regPhone">전화번호</label><input id="regPhone" type="tel" required></div><div class="field"><label for="regEmail">이메일</label><input id="regEmail" type="email" required></div><div class="field full"><label for="regAddress">주소</label><input id="regAddress" autocomplete="street-address" required></div></div><button class="primary" type="submit">회원가입 완료</button><p class="note">현재 버전은 이 브라우저의 저장소를 사용합니다. 기기 간 회원정보 공유에는 서버 연결이 필요합니다.</p></form>
</section></main><footer>© NSTUDY ACADEMY</footer>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);let returnTo=params.get('return')||'index.html';if(!/^(index\.html|02-bank\.html)$/.test(returnTo))returnTo='index.html';$('backLink').href='./'+returnTo+(returnTo==='index.html'?'#home':'');
function loadAccounts(){try{return JSON.parse(localStorage.getItem('nstudy_accounts')||'{}')}catch(e){return {}}}function saveAccounts(a){try{localStorage.setItem('nstudy_accounts',JSON.stringify(a));return true}catch(e){return false}}function message(t,err=false){$('status').textContent=t;$('status').classList.toggle('error',err);$('status').style.display='block'}function tab(which){const login=which==='login';$('loginForm').classList.toggle('hidden',!login);$('registerForm').classList.toggle('hidden',login);$('tabLogin').classList.toggle('active',login);$('tabRegister').classList.toggle('active',!login);$('heading').textContent=login?'로그인':'회원가입';$('status').style.display='none'}$('tabLogin').onclick=()=>tab('login');$('tabRegister').onclick=()=>tab('register');
$('loginForm').addEventListener('submit',e=>{e.preventDefault();const id=$('loginId').value.trim().toLowerCase(),pw=$('loginPw').value,accounts=loadAccounts(),key=Object.keys(accounts).find(k=>k.toLowerCase()===id);if(!key||!accounts[key]){message('이 브라우저에서 해당 회원을 찾을 수 없습니다. 다른 기기에서 가입한 회원은 아직 자동 공유되지 않습니다.',true);return}if(String(accounts[key].pw)!==pw){message('비밀번호를 확인해 주세요.',true);return}if(accounts[key].blocked===true){message('관리자에 의해 로그인이 제한된 회원입니다.',true);return}sessionStorage.setItem('nstudy_current_user',key);const canManage=(key==='ssjj'||accounts[key].adminAccess===true);message(canManage?'로그인되었습니다. 회원관리 화면으로 이동합니다.':'로그인되었습니다. 홈페이지로 이동합니다.');setTimeout(()=>location.href=canManage?'./index.html?openAdmin=1':'./'+returnTo+(returnTo==='index.html'?'#home':''),350)});
$('registerForm').addEventListener('submit',e=>{e.preventDefault();const id=$('regId').value.trim().toLowerCase(),pw=$('regPw').value,accounts=loadAccounts();if(Object.keys(accounts).some(k=>k.toLowerCase()===id)){message('이미 사용 중인 아이디입니다.',true);return}if(id.length<4||pw.length<6){message('아이디는 4자 이상, 비밀번호는 6자 이상 입력해 주세요.',true);return}accounts[id]={pw,type:$('regType').value,name:$('regName').value.trim(),adminAccess:id==='jcm0011'||id==='ssjj',blocked:false,school:$('regSchool').value.trim(),grade:$('regGrade').value.trim(),phone:$('regPhone').value.trim(),address:$('regAddress').value.trim(),email:$('regEmail').value.trim()};if(!saveAccounts(accounts)){message('브라우저 저장에 실패했습니다.',true);return}$('registerForm').reset();$('loginId').value=id;tab('login');message('회원가입이 완료되었습니다. 이제 로그인해 주세요.')});
})();
</script></body></html>
